<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>榮格原型特質測驗 - 量表版</title>
    <!-- 引入 Chart.js 用來畫精美的雷達圖 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'PingFang TC', sans-serif; background: #f4f5f7; color: #333; padding: 20px; line-height: 1.6; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
        .quiz-info { text-align: center; color: #7f8c8d; margin-bottom: 40px; font-size: 0.95rem; }
        
        .question-block { margin-bottom: 30px; padding-bottom: 25px; border-bottom: 1px solid #edeef0; }
        .question-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; color: #2c3e50; }
        
        /* 1-5級分按鈕排版 */
        .scale-container { display: flex; justify-content: space-between; align-items: center; max-width: 550px; margin: 0 auto; padding: 0 10px; }
        .scale-label { font-size: 0.85rem; color: #95a5a6; width: 70px; text-align: center; }
        .scale-options { display: flex; justify-content: space-between; flex-grow: 1; margin: 0 15px; }
        .scale-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative; }
        .scale-item input { margin-bottom: 8px; width: 18px; height: 18px; cursor: pointer; }
        .scale-num { font-size: 0.85rem; color: #7f8c8d; }
        
        button { display: block; width: 100%; padding: 16px; background: #4a90e2; color: white; border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer; font-weight: bold; margin-top: 40px; transition: background 0.2s; }
        button:hover { background: #357abd; }
        
        #resultSection { display: none; text-align: center; }
        .result-title { font-size: 1.8rem; color: #2c3e50; margin-top: 25px; }
        .chart-container { position: relative; margin: 30px auto; height: 360px; width: 360px; }
    </style>
</head>
<body>

<div class="container">
    <!-- 測驗進行中區塊 -->
    <div id="quizSection">
        <h1>榮格原型特質分析</h1>
        <p class="quiz-info">請依據內心最真實的直覺，評估各個描述符合您的程度（1 為非常不符合，5 為非常符合）</p>
        <form id="quizForm">
            <div id="questionsContainer"><!-- 題目由 JavaScript 自動生成 --></div>
            <button type="button" onclick="submitQuiz()">查看我的原型分析結果</button>
        </form>
    </div>

    <!-- 測驗結果區塊 -->
    <div id="resultSection">
        <h1>測驗結果</h1>
        <div class="chart-container">
            <canvas id="radarChart"></canvas>
        </div>
        <div class="result-title">主要原型：<span id="primaryResult" style="color:#4a90e2;"></span></div>
        <p style="font-size: 1.1rem; color:#7f8c8d; margin-top: 10px;">次要潛在特質：<span id="secondaryResult" style="font-weight:bold; color:#2c3e50;"></span></p>
        <button onclick="window.location.reload()">重新測驗</button>
    </div>
</div>

<script>
// ==========================================
// 1. 題庫設定
// 每一題只需填寫三個欄位：
// id: 題號
// text: 描述句（例如：「我總是尋求客觀與真理...」）
// archetype: 這題的分數要加給哪一個榮格原型
// ==========================================
const quizData = [
   { id: 1, text: "你對於生活的變化察覺敏銳並對此感到不適應跟迷茫。", archetype: "outlaw" },
{ id: 2, text: "自我療癒的過程也使你能夠幫助他人（互相治癒、經驗分享等）", archetype: "caregiver" },
{ id: 3, text: "你覺得你曾使他人對你感到失望。", archetype: "everyman" },
{ id: 4, text: "你將他人的需求視為更優先的任務（自我需求之上）", archetype: "caregiver" },
{ id: 5, text: "無論在什麼樣的狀況或場景，你都試圖展現真實的一面（不過多虛偽或是圓滑）", archetype: "explorer" },
{ id: 6, text: "當你認為生活變得乏味時，會主動創造或是尋找娛樂項目。", archetype: "jester" },
{ id: 7, text: "認為自己富有人格魅力（易吸引他人崇拜或接近）", archetype: "lover" },
{ id: 8, text: "相信人們不會本能性的想傷害彼此（傷害行為皆非自願）", archetype: "innocent" },
{ id: 9, text: "在幼兒時期曾經被忽視或受過傷害", archetype: "everyman" },
{ id: 10, text: "會全心全意投入並為自己的生活負責。", archetype: "lover" },
{ id: 11, text: "對於事情的看法擁有更長遠的大局觀（長期願景）", archetype: "sage" },
{ id: 12, text: "你正在創造自己當前的生活。", archetype: "creator" },
{ id: 13, text: "你認為你與過去自己的想法與心態相差甚遠。", archetype: "outlaw" },
{ id: 14, text: "認為生活是一場場連續的悲劇並對此感到疲憊。", archetype: "everyman" },
{ id: 15, text: "處理事情時會依賴過往經驗的直覺（例如看到1+1立馬聯想到2）", archetype: "magician" },
{ id: 16, text: "人們會向你尋求領導或意見", archetype: "ruler" },
{ id: 17, text: "你會臣服或害怕具有權力、能力的上位者。", archetype: "everyman" },
{ id: 18, text: "你並不重視規則與條匡。", archetype: "outlaw" },
{ id: 19, text: "你曾締造許多成就並毫不費力。", archetype: "hero" },
{ id: 20, text: "你具備領導能力", archetype: "ruler" },
{ id: 21, text: "你正在試圖尋找方法精進自己。", archetype: "explorer" },
{ id: 22, text: "你會對於事件抱持事實求實的心態去探索一件事的真理。", archetype: "sage" },
{ id: 23, text: "你對於想法改變的察覺靈敏，並會間接影響生活。", archetype: "magician" },
{ id: 24, text: "你渴望資源去進行對自己、未來的投資。。", archetype: "ruler" },
{ id: 25, text: "你力求客觀。", archetype: "sage" },
{ id: 26, text: "你的想法創新，容易啟發或是變革別人的觀念。", archetype: "magician" },
{ id: 27, text: "你喜歡取悅他人，使他人覺得開心、愉快。", archetype: "jester" },
{ id: 28, text: "你具有同理心，並積極投入社會、喜歡這個社會。", archetype: "lover" },
{ id: 29, text: "你擅長資源分配，將具有對應特質的對象發配到適合的崗位。", archetype: "ruler" },
{ id: 30, text: "你認為保持獨立自主、自由對你是至關重要的事。", archetype: "explorer" },
{ id: 31, text: "你相信任何事情的發生都具有因果、環環相扣。", archetype: "magician" },
{ id: 32, text: "你認為世界是一個安全且友善的地方。", archetype: "innocent" },
{ id: 33, text: "你曾經被信任的人拋下。", archetype: "everyman" },
{ id: 34, text: "你對於當前重複的生活感到不耐煩，渴望創新與自由的體驗。", archetype: "explorer" },
{ id: 35, text: "你正在捨棄你不再需要的事物與特質。（自我改進）", archetype: "outlaw" },
{ id: 36, text: "你喜歡輕鬆且愉快的場面，想讓嚴肅的場面或對象放輕鬆些。", archetype: "jester" },
{ id: 37, text: "覺得混亂的狀況有益身心🫪", archetype: "jester" },
{ id: 38, text: "覺得自我奉獻是一件榮幸且美好的事。", archetype: "caregiver" },
{ id: 39, text: "你時常保持理性與客觀", archetype: "sage" },
{ id: 40, text: "你會挺身對抗不公平的對待，並認為這件事是你的義務。", archetype: "hero" },
{ id: 41, text: "你喜歡改變現狀。", archetype: "magician" },
{ id: 42, text: "你認為成功的關鍵在於自律。", archetype: "hero" },
{ id: 43, text: "創作靈感對你而言得來容易。", archetype: "creator" },
{ id: 44, text: "你總是自負、對自己感到失望。", archetype: "hero" },
{ id: 45, text: "你感覺並相信世界會變得美好。", archetype: "innocent" },
{ id: 46, text: "你總認為你遇到的人都值得信賴。", archetype: "innocent" },
{ id: 47, text: "你正在實踐你的想法或夢幻。", archetype: "creator" },
{ id: 48, text: "你合理認為你的需求應當被滿足。", archetype: "innocent" },
{ id: 49, text: "你總想破某些東西，目的是使場面變得荒謬。", archetype: "outlaw" },
{ id: 50, text: "你總是考慮大體的利益而非自我。", archetype: "caregiver" },
{ id: 51, text: "你很難拒絕他人向你提出的請求。（爛好人是你(￣∇￣)）", archetype: "caregiver" },
{ id: 52, text: "你的靈感與想法多到沒時間去實踐。", archetype: "creator" },
{ id: 53, text: "你總在探索更好的可能性。", archetype: "explorer" },
{ id: 54, text: "你曾讓你生命中重要的人感到失望。", archetype: "everyman" },
{ id: 55, text: "尋找某物的過程與找到它同樣重要。", archetype: "explorer" },
];

// 12 原型中文名稱對照表
const archetypeNames = {
    innocent: "天真者", sage: "智者", explorer: "探險家", outlaw: "反叛者",
    hero: "英雄", magician: "魔術師", everyman: "凡夫俗子", lover: "情人",
    jester: "愚者", caregiver: "照顧者", creator: "創造者", ruler: "統治者"
};

// ==========================================
// 2. 自動渲染 1-5 級分題目到網頁上
// ==========================================
const container = document.getElementById('questionsContainer');
quizData.forEach((q, index) => {
    let html = `
        <div class="question-block">
            <div class="question-title">${index + 1}. ${q.text}</div>
            <div class="scale-container">
                <span class="scale-label">非常不符合</span>
                <div class="scale-options">
    `;
    
    // 生成 1 到 5 的級分按鈕
    for (let score = 1; score <= 5; score++) {
        // 將該題綁定的原型和分數儲存在 radio value 中
        const valStr = JSON.stringify({ archetype: q.archetype, score: score });
        html += `
            <label class="scale-item">
                <input type="radio" name="q_${q.id}" value='${valStr}' required>
                <span class="scale-num">${score}</span>
            </label>
        `;
    }
    
    html += `
                </div>
                <span class="scale-label">非常符合</span>
            </div>
        </div>
    `;
    container.innerHTML += html;
});

// ==========================================
// 3. 計算分數與產出結果核心引擎
// ==========================================
function submitQuiz() {
    // 初始化 12 原型計分板
    let scores = {
        innocent: 0, sage: 0, explorer: 0, outlaw: 0, hero: 0, magician: 0,
        everyman: 0, lover: 0, jester: 0, caregiver: 0, creator: 0, ruler: 0
    };

    const form = document.getElementById('quizForm');
    const formData = new FormData(form);
    
    // 檢查是否有題目漏寫
    let answeredCount = 0;
    for (let pair of formData.entries()) { answeredCount++; }
    if (answeredCount < quizData.length) {
        alert("您還有題目尚未填答喔！為了確保結果精準，請檢查並填完所有題目。");
        return;
    }

    // 讀取點選的級分，直接累加到對應的原型變數
    for (let value of formData.values()) {
        const data = JSON.parse(value);
        scores[data.archetype] += data.score;
    }

    // 排序原型分數，抓出前兩名
    let sorted = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
    let primary = sorted[0];
    let secondary = sorted[1];

    // 切換顯示區塊
    document.getElementById('quizSection').style.display = 'none';
    document.getElementById('resultSection').style.display = 'block';

    // 填入文字結果
    document.getElementById('primaryResult').innerText = archetypeNames[primary];
    document.getElementById('secondaryResult').innerText = archetypeNames[secondary];

    // 滾動回到頂部看結果
    window.scrollTo({ top: 0, behavior: 'smooth' });

    // 繪製雷達圖
    drawRadarChart(scores);
}

// ==========================================
// 4. 繪製雷達圖功能
// ==========================================
function drawRadarChart(scores) {
    const ctx = document.getElementById('radarChart').getContext('2d');
    
    const labels = Object.keys(scores).map(key => archetypeNames[key]);
    const dataValues = Object.keys(scores).map(key => scores[key]);

    new Chart(ctx, {
        type: 'radar',
        data: {
            labels: labels,
            datasets: [{
                label: '原型能量強度',
                data: dataValues,
                backgroundColor: 'rgba(74, 144, 226, 0.2)',
                borderColor: 'rgba(74, 144, 226, 1)',
                borderWidth: 2,
                pointBackgroundColor: 'rgba(74, 144, 226, 1)',
                pointRadius: 3
            }]
        },
        options: {
            scales: {
                r: {
                    ticks: { display: false },
                    suggestedMin: 0
                }
            },
            plugins: { legend: { display: false } }
        }
    });
}
</script>
</body>
</html>
